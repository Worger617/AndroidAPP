plugins {
    alias(libs.plugins.androidLibrary)
}

android {
    namespace 'com.ls.libbase'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dataBinding {
        enable true
    }
}

dependencies {

    api libs.appcompat
    api libs.material
    api libs.activity
    api libs.constraintlayout
    api libs.arouter
    api libs.liveData
    api libs.viewModel
    api libs.androidAutoSize
    api libs.flycoTabLayout
    api libs.glide
    api libs.security
    api libs.eventBus

    api libs.refreshlayout
    api libs.refreshlayoutRadar
    api libs.refreshlayoutFooterBall

    api project(":network")//引用网络库
//    api project(":library_wechat")//引用微信库
    api project(":library_umeng")//引用umeng库
    annotationProcessor libs.arouterCompiler

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'
}