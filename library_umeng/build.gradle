plugins {
    alias(libs.plugins.androidLibrary)
}

android {
    namespace 'com.ls.librumeng'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core


    // 友盟基础组件库（所有友盟业务SDK都依赖基础组件库）
    api  'com.umeng.umsdk:common:9.4.2'//必选
    api   'com.umeng.umsdk:asms:1.4.1'//必选

    // 分享相关库
    api 'com.umeng.umsdk:share-core:7.1.6'//分享核心库，必选
    api 'com.umeng.umsdk:share-board:7.1.6'//分享面板功能，可选
//    implementation 'com.umeng.umsdk:link:1.1.0'//集成智能超链U-Link，可选，如要统计分享回流次数和分享新增用户指标则必选

    // 第三方平台相关库，可根据需要自行选择
    api 'com.umeng.umsdk:share-wx:7.1.6' //微信完整版
    api 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.9'//微信官方依赖库，必选

//    implementation 'com.umeng.umsdk:share-qq:7.1.6'//QQ完整版
//    implementation 'com.tencent.tauth:qqopensdk:3.53.0'//QQ官方依赖库，必选
//    implementation 'com.squareup.okhttp3:okhttp:3.12.12'//QQ SDK在3.53.0版本及以上时需要集成okhttp官方依赖库，必选
//
//    implementation 'com.umeng.umsdk:share-sina:7.1.6'//新浪微博完整版
//    implementation 'com.sina.weibo.sdk:core:10.10.0:openDefaultRelease@aar'//新浪微博官方SDK依赖库，必选，如在线集成失败请本地下载离线包https://counsel.umeng.com/api/activity/download?fileName=activity/67/openDefault-10.10.0.aar

}